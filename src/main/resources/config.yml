# WORD CHAIN CONFIGURATION
#
# HELP:
# - " " for new line
# & for color and special symbols
# %prefix% for prefix
# Every message supports a list (one line per entry) or a single line.

# Config Version
# DON'T CHANGE THIS!!!
config-version: 1

# Prefix:
prefix: "&7[&bWordChain&7] "

# ===========================================================================
# ROOM SETTINGS
# ===========================================================================
room:
  # Seconds an invite (/wc invite) stays valid.
  invite-timeout: 60

# ===========================================================================
# GAME SETTINGS
# ===========================================================================
game:
  # Minimum players needed before the host can use /wc start.
  min-players: 2
  # Lives (health) each player has for the whole game. Running out of time costs 1 life.
  # At 0 lives the player is eliminated. Set to 1 for instant elimination.
  lives: 3
  # Turn health: how many wrong words a player can type in ONE turn (resets every turn).
  # When they are all used, the player loses 1 life and the turn goes to the next player.
  turn-health: 3
  # Maximum players in one game.
  max-players: 10
  # Seconds between /wc start and the real start of the game (0 = instant).
  start-countdown: 10
  # Seconds each player has for their turn in the first round.
  turn-time: 20
  # The turn time gets shorter every round by this many seconds...
  time-decrease-per-round: 1
  # ...but never goes below this.
  min-turn-time: 8
  # Minimum letters in a word.
  min-word-length: 3

# ===========================================================================
# STAGE (third person view)
# While a game is running every player is put in spectator mode and watches
# through a camera. The camera glides to the player whose turn it is.
# Above that player: the required letter and every word they type (white).
# Play on flat ground, the seats are placed in a circle around the host.
# Players get their old game mode and location back when the game ends.
# ===========================================================================
stage:
  # false = old first person mode (no camera, words only in chat)
  enabled: true
  # Radius of the circle of seats (blocks)
  radius: 5.0
  # How far in front of the player the camera stands, and how high
  camera-distance: 3.5
  camera-height: 1.4
  # Height the camera looks at (above the floor)
  look-height: 1.3
  # Ticks the camera needs to glide to the next player (20 ticks = 1 second)
  move-ticks: 25
  # Ticks the winner stays in view before everyone goes back (20 ticks = 1 second)
  end-delay: 80
  # Floating text above the player
  text-height: 1.9
  text-scale: 1.5
  letter-format: "&6&l%letter%"
  attempt-format: "&f%word%"
  name-format: "&7%player%"
  eliminated-format: "&c&m%player%"

# ===========================================================================
# REWARDS
# ===========================================================================
rewards:
  # Commands run by the console when someone wins. %player% = winner name.
  # Example:
  #   - "give %player% diamond 3"
  winner-commands: []

# ===========================================================================
# MESSAGES
# Placeholders: %player% %word% %letter% %time% %seconds% %players% %max% %min% %lives% %tries% %host%
# ===========================================================================
messages:
  # Shown instead of a letter on the first word of a game.
  any-letter: "ANY"

  # Command messages
  no-permission: "%prefix%&cYou don't have permission to do that."
  only-player: "%prefix%&cOnly players can use this command."
  reloaded: "%prefix%&aConfig reloaded."
  stopped: "%prefix%&aThe room has been closed."
  cannot-start: "%prefix%&cYou need at least %min% players to start."
  status: "%prefix%&7Host: &f%host% &7| State: &f%state% &7| Players: &f%players%"
  help:
    - "&8&m                                        "
    - "&b&lWordChain &7- type words that start with the last letter of the previous word!"
    - "&e/wordchain join &7- Create a room (you become the host)"
    - "&e/wordchain invite <player> &7- Invite a player to your room &8(host)"
    - "&e/wordchain accept [host] &7- Accept an invite"
    - "&e/wordchain deny &7- Deny your invites"
    - "&e/wordchain start &7- Start the game &8(host)"
    - "&e/wordchain leave &7- Leave your room"
    - "&e/wordchain stop &7- Close your room &8(host)"
    - "&e/wordchain status &7- See your room status"
    - "&e/wordchain stop <host> &7- Close a room &8(admin)"
    - "&e/wordchain reload &7- Reload config &8(admin)"
    - "&8&m                                        "

  # Room messages
  room-created:
    - "%prefix%&aRoom created! You are the host."
    - "%prefix%&7Use &e/wc invite <player> &7to invite players, then &e/wc start&7."
  already-in-room: "%prefix%&cYou are already in a room. Use /wc leave first."
  not-in-room: "%prefix%&cYou are not in a room. Use /wc join to create one."
  not-host: "%prefix%&cOnly the host can do that."
  room-not-waiting: "%prefix%&cThat room is not available (the game already started or the room was closed)."
  room-full: "%prefix%&cThe room is full."
  room-not-found: "%prefix%&cNo room found for host &f%player%&c."
  new-host: "%prefix%&e%player% &7is the new host."
  usage-invite: "%prefix%&cUsage: /wc invite <player>"
  player-offline: "%prefix%&c%player% is not online."
  cannot-invite-self: "%prefix%&cYou can't invite yourself."
  target-in-room: "%prefix%&c%player% is already in a room."
  already-invited: "%prefix%&c%player% is already invited."
  invite-sent: "%prefix%&7Invite sent to &a%player%&7."
  invite-received:
    - "%prefix%&e%player% &7invited you to a Word Chain room!"
    - "%prefix%&7Type &a/wc accept %player% &7to join or &c/wc deny &7to decline. &8(expires in %seconds%s)"
  no-invite: "%prefix%&cYou have no pending invites."
  no-invite-from: "%prefix%&cYou have no invite from %player%."
  multiple-invites: "%prefix%&cYou have more than one invite. Use &e/wc accept <host>&c."
  invite-denied: "%prefix%&7Invites denied."
  player-joined: "%prefix%&a%player% &7joined the room &8(%players%/%max%)"
  player-left: "%prefix%&c%player% &7left the room."
  you-left: "%prefix%&7You left the room."
  countdown-cancelled: "%prefix%&cNot enough players. Countdown cancelled."
  countdown: "%prefix%&7Game starts in &e%seconds% &7second(s)..."

  # Game messages
  game-started:
    - "%prefix%&aThe game has started!"
    - "%prefix%&7Type a word that starts with the last letter of the previous word. Don't run out of time!"
  your-turn-broadcast: "%prefix%&e%player%&7's turn! Letter: &b%letter% &7(&c%time%s&7) &8| &c%lives%❤ &8| &e%tries% &7tries"
  your-turn: "%prefix%&aIt's your turn! Type a word starting with &b%letter% &ain chat."
  actionbar: "&e%player% &8| &7Letter: &b%letter% &8| &c%time%s &8| &c%lives%❤ &8| &7Tries: &e%tries%"
  word-accepted: "%prefix%&b%player% &8» &f%word% &7- next letter: &b%letter%"

  # Wrong word messages (the player can try again until time runs out)
  invalid-characters: "%prefix%&cUse letters only (a-z), one word."
  too-short: "%prefix%&cYour word must have at least %min% letters."
  wrong-letter: "%prefix%&cYour word must start with &b%letter%&c!"
  already-used: "%prefix%&c\"%word%\" was already used."
  not-a-word: "%prefix%&c\"%word%\" is not an English word."

  # End messages
  tries-left: "%prefix%&7Tries left this turn: &e%tries%"
  life-lost-timeout: "%prefix%&c%player% &7ran out of time and lost a life! &8(&c%lives%❤ &8left)"
  life-lost-wrong: "%prefix%&c%player% &7used all tries and lost a life! &8(&c%lives%❤ &8left)"
  eliminated-wrong: "%prefix%&c%player% &7used all tries with no lives left and is eliminated!"
  eliminated-timeout: "%prefix%&c%player% &7ran out of time with no lives left and is eliminated!"
  eliminated-left: "%prefix%&c%player% &7left and is eliminated!"
  game-stopped: "%prefix%&cThe room was closed."
  no-winner: "%prefix%&7The game ended with no winner."
  winner:
    - "%prefix%&6&l%player% &ewon the game!"
    - "%prefix%&7Words used: &f%words% &7| Rounds: &f%rounds%"