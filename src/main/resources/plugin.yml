name: WordChain
version: '${project.version}'
main: org.kylan1940.wordchain.WordChain
api-version: '1.21'
author: Kylan1940
website: https://github.com/Kylan1940/WordChain
description: English Word Chain minigame for Minecraft servers

commands:
  wordchain:
    description: Word Chain main command
    usage: /wordchain <join|invite|accept|deny|start|leave|stop|status|reload>
    aliases: [wc]

permissions:
  wordchain-play.command:
    description: Create a room, invite, accept, start, leave and stop your own room
    default: true
  wordchain-stop.command:
    description: Stop the room of any host (/wordchain stop <host>)
    default: op
  wordchain-reload.command:
    description: Reload the WordChain config
    default: op